      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)" opacity="0.12"/>
  <!-- Grid of tool blocks -->
  <rect x="24" y="28" width="20" height="20" rx="4" fill="#6366F1" opacity="0.6"/>
  <rect x="50" y="28" width="20" height="20" rx="4" fill="#6366F1" opacity="0.6"/>
  <rect x="76" y="28" width="20" height="20" rx="4" fill="#6366F1" opacity="0.4"/>
  <rect x="24" y="54" width="20" height="20" rx="4" fill="#6366F1" opacity="0.5"/>
  <rect x="50" y="54" width="20" height="20" rx="4" fill="#818CF8" opacity="0.8"/>
  <rect x="76" y="54" width="20" height="20" rx="4" fill="#6366F1" opacity="0.3"/>
  <rect x="24" y="80" width="20" height="20" rx="4" fill="#6366F1" opacity="0.3"/>
  <rect x="50" y="80" width="20" height="20" rx="4" fill="#6366F1" opacity="0.4"/>
  <rect x="76" y="80" width="20" height="20" rx="4" fill="#6366F1" opacity="0.5"/>
  <!-- Magnifying glass -->
  <circle cx="78" cy="72" r="18" fill="none" stroke="#312E81" stroke-width="5" stroke-linecap="round"/>
  <line x1="91" y1="85" x2="106" y2="100" stroke="#312E81" stroke-width="6" stroke-linecap="round"/>
  <!-- Highlight in lens -->
  <circle cx="78" cy="72" r="12" fill="#EEF2FF" opacity="0.3"/>
